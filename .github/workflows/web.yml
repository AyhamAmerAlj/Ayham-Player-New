name: Deploy web player

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['webcf/**', 'webnode/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webcf
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        run: node test/test.mjs && node ../webnode/test.mjs
      - name: Deploy
        run: npx --yes wrangler@4 deploy
      - name: Set secrets
        env:
          WEB_XTREAM_URL: ${{ secrets.WEB_XTREAM_URL }}
          WEB_XTREAM_USER: ${{ secrets.WEB_XTREAM_USER }}
          WEB_XTREAM_PASS: ${{ secrets.WEB_XTREAM_PASS }}
          WEB_ACCESS_PASSWORD: ${{ secrets.WEB_ACCESS_PASSWORD }}
        run: |
          set_secret() { if [ -n "$2" ]; then printf %s "$2" | npx --yes wrangler@4 secret put "$1" >/dev/null && echo "set $1"; else echo "skip $1 (empty)"; fi; }
          printf '%s' "$(printf '%s' "link|$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)" | npx --yes wrangler@4 secret put LINK_KEY >/dev/null && echo 'set LINK_KEY'
          set_secret XTREAM_URL "$WEB_XTREAM_URL"
          set_secret XTREAM_USER "$WEB_XTREAM_USER"
          set_secret XTREAM_PASS "$WEB_XTREAM_PASS"
          set_secret ACCESS_PASSWORD "$WEB_ACCESS_PASSWORD"
