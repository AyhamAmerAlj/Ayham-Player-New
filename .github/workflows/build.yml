name: Build Ayham Player APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Version code (offset to stay above the old repository's builds)
        run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        env:
          LICENSE_URL: ${{ vars.LICENSE_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set +e
          gradle :app:assembleRelease --no-daemon --stacktrace > build.log 2>&1
          code=$?
          tail -n 5 build.log
          if [ $code -ne 0 ]; then
            grep -E "^e: |error:|What went wrong|Caused by|Could not|Unresolved|Execution failed" -A2 build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | cut -c1-300 | head -120 > errors.txt
            split -l 14 errors.txt chunk_
            n=0
            for f in chunk_*; do
              n=$((n+1))
              [ $n -gt 9 ] && break
              MSG=$(sed 's/%/%25/g' "$f" | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=BUILD ERRORS part $n::$MSG"
            done
          fi
          exit $code

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AyhamPlayer.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyhamPlayer
          path: AyhamPlayer.apk

      - name: Publish release (رابط ثابت للتحميل)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.VERSION_CODE }}
          name: Ayham Player build ${{ env.VERSION_CODE }}
          make_latest: true
          files: AyhamPlayer.apk
