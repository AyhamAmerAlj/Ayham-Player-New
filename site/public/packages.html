<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الباقات - Ayham Player</title>
<meta name="description" content="باقات Ayham Player وأسعارها. اطلب مباشرة عبر واتساب.">
<meta name="theme-color" content="#07040f">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07040f}
a{text-decoration:none;color:inherit}
.ap{font-family:'Cairo',system-ui,sans-serif;background:#07040f;color:#f1ecff;overflow:hidden}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px;box-sizing:border-box}
.nav{display:flex;align-items:center;justify-content:space-between;padding:18px 0;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:22px}
.brand img{width:44px;height:44px;border-radius:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 26px;border-radius:14px;font-weight:700;font-size:17px;border:1px solid #a78bfa66;background:linear-gradient(135deg,#8b5cf6,#5b21b6);color:#fff;cursor:pointer;box-shadow:0 10px 30px #7c3aed55}
.btn:hover{filter:brightness(1.12)}
.btn.wa{background:linear-gradient(135deg,#22c55e,#15803d);border-color:#4ade8066;box-shadow:0 10px 30px #16a34a44}
.btn.ghost{background:#ffffff12;border-color:#ffffff30;box-shadow:none}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:50px 0 70px}
.hero h1{font-size:58px;line-height:1.2;margin:0 0 18px;font-weight:900}
.hero h1 span{background:linear-gradient(90deg,#c4b5fd,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:20px;line-height:1.8;color:#c9bfe6;margin:0 0 28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.glow{position:relative;display:grid;place-items:center}
.glow:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,#7c3aed88,transparent 65%);filter:blur(10px)}
.logo-card{position:relative;width:280px;height:280px;border-radius:64px;border:1px solid #a78bfa55;box-shadow:0 30px 80px #5b21b688}
.logo-mark{position:relative;width:310px;max-width:70vw;height:auto;border-radius:36px;filter:drop-shadow(0 20px 50px #7c3aed99)}
.tag{display:inline-block;margin-bottom:14px;padding:6px 16px;border-radius:99px;background:#8b5cf61f;border:1px solid #8b5cf655;color:#ddd1ff;font-size:16px;font-weight:600}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.chip{padding:8px 16px;border-radius:99px;background:#8b5cf61f;border:1px solid #8b5cf655;color:#ddd1ff;font-size:15px}
h2.t{font-size:40px;font-weight:900;margin:0 0 12px;text-align:center}
p.sub{text-align:center;color:#b7abd6;font-size:18px;margin:0 auto 44px;max-width:640px;line-height:1.8}
.sec{padding:70px 0}
.alt{background:linear-gradient(#0d0719,#07040f)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.f{background:#140b26;border:1px solid #2a1a4d;border-radius:20px;padding:24px}
.f:hover{border-color:#8b5cf6}
.f svg{width:34px;height:34px;stroke:#a78bfa;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-bottom:14px}
.f h3{margin:0 0 8px;font-size:20px}
.f p{margin:0;color:#b7abd6;line-height:1.8;font-size:16px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.box{border-radius:20px;padding:26px;border:1px solid #2a1a4d;background:#140b26}
.box.on{border-color:#8b5cf6;background:linear-gradient(160deg,#241046,#140b26)}
.box h3{margin:0 0 14px;font-size:22px}
.box ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.box li{display:flex;gap:10px;line-height:1.7;color:#cfc5ea}
.box li:before{content:"•";color:#8b5cf6;font-weight:900}
.price{max-width:560px;margin:0 auto;background:linear-gradient(160deg,#2a1260,#140b26 60%);border:1.5px solid #a78bfa;border-radius:28px;padding:38px;text-align:center;box-shadow:0 30px 90px #5b21b655}
.price .n{font-size:76px;font-weight:900;line-height:1}
.price .n small{font-size:22px;font-weight:700;color:#c4b5fd;margin-inline-start:8px}
.price ul{list-style:none;margin:24px 0;padding:0;display:grid;gap:10px;text-align:start}
.price li{display:flex;gap:10px;align-items:center;color:#e4dcfa}
.price li svg{width:20px;height:20px;stroke:#4ade80;fill:none;stroke-width:2.5;flex:none}
.pay{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:40px}
.pm{background:#140b26;border:1px solid #2a1a4d;border-radius:20px;padding:22px;text-align:center}
.pm b{display:block;font-size:20px;margin-bottom:6px}
.pm span{display:block;color:#b7abd6;font-size:15px}
.pm code{display:inline-block;margin-top:10px;padding:6px 14px;border-radius:10px;background:#0f0820;border:1px dashed #8b5cf6;color:#ddd1ff;font-size:17px;direction:ltr;font-family:inherit}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:44px}
.st{text-align:center;padding:10px}
.st i{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 12px;border-radius:50%;background:#8b5cf6;font-style:normal;font-weight:900;font-size:20px}
.st p{margin:0;color:#c9bfe6;line-height:1.7;font-size:16px}
details{background:#140b26;border:1px solid #2a1a4d;border-radius:16px;padding:18px 22px;margin-bottom:12px}
summary{cursor:pointer;font-weight:700;font-size:18px}
details p{color:#b7abd6;line-height:1.9;margin:12px 0 0;font-size:16px}
.note{background:#1a0f33;border:1px solid #3b2a6b;border-radius:16px;padding:18px 22px;color:#cfc5ea;line-height:1.9;font-size:15.5px;max-width:860px;margin:36px auto 0}
.foot{border-top:1px solid #2a1a4d;padding:30px 0;text-align:center;color:#8f84ad;font-size:14px}
@media (min-width:901px){.shots img{height:420px}}
@media (max-width:900px){
.logo-mark{width:210px}
.hero{grid-template-columns:1fr;text-align:center;padding-top:20px}
.hero h1{font-size:40px}.hero p{font-size:17px}
.cta,.chips{justify-content:center}
.logo-card{width:200px;height:200px;border-radius:46px}
.glow:before{width:300px;height:300px}
.grid,.pay{grid-template-columns:1fr 1fr}
.steps{grid-template-columns:1fr 1fr}
h2.t{font-size:30px}
.cmp{grid-template-columns:1fr}
}
@media (max-width:560px){
.grid,.pay,.steps{grid-template-columns:1fr}
.price .n{font-size:58px}
.sec{padding:48px 0}
.btn{width:100%}
}
.old{font-size:26px;color:#9a8fb8;text-decoration:line-through;text-decoration-thickness:2px;margin-bottom:6px}
.off{display:inline-block;background:#16a34a;color:#fff;font-weight:900;font-size:15px;border-radius:99px;padding:4px 14px;margin-bottom:12px}
.notice{max-width:560px;margin:18px auto 0;background:#1a0f33;border:1px solid #8b5cf6;border-radius:16px;padding:16px 20px;color:#e4dcfa;line-height:1.9;text-align:center}
.notice b{color:#fff}
.log{max-width:860px;margin:0 auto;display:grid;gap:12px}
.log div{background:#140b26;border:1px solid #2a1a4d;border-radius:16px;padding:16px 20px;display:flex;gap:14px;align-items:flex-start;line-height:1.8;color:#cfc5ea}
.log b{color:#fff;display:block}
.log i{flex:none;width:10px;height:10px;border-radius:50%;background:#8b5cf6;margin-top:11px}
.shots{display:flex;gap:16px;overflow-x:auto;padding:6px 4px 18px;scroll-snap-type:x mandatory}
.shots figcaption{margin-top:10px;text-align:center;color:#b7abd6;font-size:15px}
.shots figure{margin:0;flex:none;scroll-snap-align:center}
.shots img{display:block;height:340px;width:auto;max-width:80vw;border-radius:16px;border:1px solid #3b2a6b;box-shadow:0 14px 40px #00000088}

.pg{padding:56px 0 30px;text-align:center}
.pg h1{font-size:44px;font-weight:900;margin:0 0 10px}
.pg p{color:#b7abd6;font-size:18px;line-height:1.8;max-width:640px;margin:0 auto}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px;max-width:960px;margin:34px auto 0;align-items:stretch}
.plan{position:relative;display:flex;flex-direction:column;background:#140b26;border:1px solid #2a1a4d;border-radius:24px;padding:28px 24px;text-align:start}
.plan.hot{border-color:#a78bfa;background:linear-gradient(160deg,#2a1260,#140b26 62%);box-shadow:0 24px 70px #5b21b655}
.plan h2{margin:0 0 6px;font-size:24px}
.plan .d{color:#b7abd6;line-height:1.8;font-size:15.5px;margin:0 0 14px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bd{padding:4px 12px;border-radius:99px;font-size:13.5px;font-weight:700;background:#8b5cf61f;border:1px solid #8b5cf655;color:#ddd1ff}
.bd.g{background:#16a34a22;border-color:#16a34a66;color:#86efac}
.plan .p{font-size:54px;font-weight:900;line-height:1.1}
.plan .p small{font-size:18px;font-weight:700;color:#c4b5fd;margin-inline-start:6px}
.plan .per{color:#c4b5fd;font-weight:700;margin:4px 0 16px}
.plan ul{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:10px;flex:1}
.plan li{display:flex;gap:10px;align-items:flex-start;color:#e4dcfa;line-height:1.7}
.plan li svg{width:20px;height:20px;stroke:#4ade80;fill:none;stroke-width:2.5;flex:none;margin-top:3px}
.plan .btn{width:100%;box-sizing:border-box}
.fine{max-width:760px;margin:36px auto 0;color:#9a8fb8;font-size:14.5px;line-height:1.9;text-align:center}
@media (max-width:560px){.pg h1{font-size:32px}.plan .p{font-size:46px}}
</style>
</head>
<body>
<div class="ap">
<header class="wrap">
<div class="nav">
<a class="brand" href="./"><img src="icon.png" alt="شعار Ayham Player"><span>Ayham Player</span></a>
<a class="btn ghost" href="./" style="min-height:42px;font-size:15px">الرئيسية</a>
</div>
<div class="pg">
<h1>الباقات</h1>
<p>اختر الباقة المناسبة واطلبها مباشرة عبر واتساب. تصلك رسالة جاهزة باسم الباقة وسعرها.</p>
</div>
</header>
<main class="wrap">
<div class="plans" id="plans" aria-live="polite"></div>
<p class="fine">الدفع عبر SuperQi أو Zain Cash، ثم ارسل لقطة شاشة (Screenshot) التحويل على واتساب ويصلك كود التفعيل الشخصي.</p>
</main>
<footer class="foot"><div class="wrap">© Ayham Player</div></footer>
</div>
<noscript><p style="text-align:center;color:#fff">فعّل JavaScript لعرض الباقات أو تواصل معنا عبر واتساب.</p></noscript>
<script src="plans.js"></script>
<script>
(function(){
  var el=document.getElementById('plans');
  var CHECK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4 4L19 7"></path></svg>';
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}
  function fmt(n){return Number(n).toLocaleString('en-US');}
  el.innerHTML=window.PLANS.map(function(p){
    var per=p.period==='month'?'شهريًا':'دفعة واحدة';
    var bd=(p.badges||[]).map(function(b,i){return '<span class="bd'+(i===0?' g':'')+'">'+esc(b)+'</span>';}).join('');
    var msg='مرحبًا، أريد طلب '+p.name+' بسعر '+fmt(p.price)+' دينار عراقي ('+(p.period==='month'?'شهريًا':'دفعة واحدة')+')';
    var href='https://wa.me/'+window.WA_NUMBER+'?text='+encodeURIComponent(msg);
    return '<article class="plan'+(p.hot?' hot':'')+'"><div class="badges">'+bd+'</div><h2>'+esc(p.name)+'</h2><p class="d">'+esc(p.desc)+'</p><div class="p">'+fmt(p.price)+'<small>دينار عراقي</small></div><div class="per">'+per+'</div><ul>'+(p.features||[]).map(function(f){return '<li>'+CHECK+'<span>'+esc(f)+'</span></li>';}).join('')+'</ul><a class="btn wa" href="'+href+'" target="_blank" rel="noopener">اطلب عبر واتساب</a></article>';
  }).join('');
})();
</script>
</body>
</html>
