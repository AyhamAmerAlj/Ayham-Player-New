<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Ayham Player</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07040e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ayham">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/app.css?v=4">
</head>
<body>

<div id="login" class="hide">
  <img class="lg" src="/icon-512.png" alt="">
  <h1>Ayham Player</h1>
  <div class="tg" id="ltag"></div>
  <form class="card" id="lf" autocomplete="on">
    <div class="f"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="in-pwd" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"></div>
    <div class="msg" id="lmsg"></div>
    <button class="btn press" id="lbtn" type="submit"></button>
    <div class="hint">بيانات اشتراكك محفوظة على الخادم ولا تصل للمتصفح أبدًا.</div>
  </form>
</div>

<div id="setup" class="hide">
  <img class="lg" src="/icon-512.png" alt="" style="width:84px;border-radius:22px">
  <h1 style="font-size:24px">بيانات الاشتراك</h1>
  <div class="tg">أدخل رابط السيرفر واسم المستخدم وكلمة المرور من مزوّد اشتراكك. تُحفظ مشفّرة على الخادم فقط.</div>
  <form class="card" id="sf" autocomplete="off">
    <div class="f"><input id="s-url" type="url" placeholder="http://server:8080" dir="ltr" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url"></div>
    <div class="f"><input id="s-user" type="text" placeholder="اسم المستخدم" dir="ltr" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="f"><input id="s-pass" type="password" placeholder="كلمة مرور الاشتراك" dir="ltr" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="msg" id="smsg"></div>
    <button class="btn press" id="sbtn" type="submit">حفظ والدخول</button>
    <button class="bs press" id="scancel" type="button" style="justify-content:center">رجوع</button>
  </form>
</div>
<div class="top hide" id="top"></div>
<div id="app" class="hide"><div id="view"></div></div>
<nav id="nav" class="hide"></nav>
<div id="sheet" class="hide"></div>

<div id="pl" class="hide">
  <video id="v" playsinline webkit-playsinline x-webkit-airplay="allow" preload="auto"></video>
  <div id="p-tap" style="position:absolute;inset:0"></div>
  <div class="rip l">−10</div><div class="rip r">+10</div>
  <div class="ov">
    <div class="pt">
      <button class="ib press" data-p="back" aria-label="back"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <b id="p-title"></b>
      <button class="ib press" data-p="fav" aria-label="fav"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg></button>
    </div>
    <div class="pc">
      <button class="press liveonly hide" data-p="prev"><svg viewBox="0 0 24 24"><path d="M6 6v12M20 6L9 12l11 6z"/></svg></button>
      <button class="press vodonly" data-p="b10"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="sk">10</span></button>
      <button class="big press" data-p="pp" id="p-pp"></button>
      <button class="press vodonly" data-p="f10"><svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="sk">10</span></button>
      <button class="press liveonly hide" data-p="next"><svg viewBox="0 0 24 24"><path d="M18 6v12M4 6l11 6-11 6z"/></svg></button>
    </div>
    <div class="pb">
      <div id="p-seekrow">
        <div class="sb" id="p-sb"><div class="tr_"><div class="bf" id="p-bf"></div><div class="pr" id="p-pr"></div></div><div class="kn" id="p-kn" style="left:0"></div></div>
        <div class="tm"><span id="p-cur">0:00</span><span id="p-dur">0:00</span></div>
      </div>
      <div class="tm hide" id="p-livetag"><span class="lv">LIVE</span></div>
      <div class="pr2">
        <button class="press" data-p="subs"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 10.5a2.2 2.2 0 1 0 0 3M17 10.5a2.2 2.2 0 1 0 0 3"/></svg>CC</button>
        <button class="press" data-p="audio"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10zM16.5 8.5a5 5 0 0 1 0 7"/></svg></button>
        <button class="press vodonly" data-p="speed"><svg viewBox="0 0 24 24"><path d="M12 14l4-5M4.5 17a9 9 0 1 1 15 0"/></svg><span id="p-speedl">1×</span></button>
        <button class="press" data-p="pip"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="5" rx="1" fill="#fff"/></svg></button>
        <button class="press" data-p="air" id="p-air"><svg viewBox="0 0 24 24"><path d="M5 17H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-1M12 14l5 6H7z"/></svg></button>
        <button class="press" data-p="fs"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </div>
  </div>
  <div class="nowb hide" id="p-now"></div>
  <div class="upn hide" id="p-un"></div>
  <div class="spin hide" id="p-spin"></div>
  <div class="err hide" id="p-err"></div>
</div>
<input type="file" id="subfile" accept=".srt,.vtt,.txt,text/plain,text/vtt" class="hide">
<script src="/app.js?v=6"></script>
</body>
</html>
